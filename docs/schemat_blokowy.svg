<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .t  { font-weight: 600; }
      .s  { font-size: 11px; fill: #444; }
      .h  { font-size: 15px; font-weight: 700; }
      .ln { stroke: #333; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect width="1400" height="780" fill="#ffffff"/>
  <text x="700" y="26" text-anchor="middle" class="h" font-size="18">SeqGen16 – schemat blokowy systemu</text>

  <!-- ===================== PC ===================== -->
  <rect x="20" y="50" width="220" height="330" rx="8" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="130" y="74" text-anchor="middle" class="h">PC (Windows, Python)</text>
  <rect x="35" y="90" width="190" height="56" rx="5" fill="#fff" stroke="#4a6fa5"/>
  <text x="130" y="112" text-anchor="middle" class="t">seqgen_gui.py</text>
  <text x="130" y="130" text-anchor="middle" class="s">GUI: edytor przebiegów, podgląd</text>
  <rect x="35" y="156" width="190" height="44" rx="5" fill="#fff" stroke="#4a6fa5"/>
  <text x="130" y="176" text-anchor="middle" class="t">seqgen_cli.py</text>
  <text x="130" y="192" text-anchor="middle" class="s">linia poleceń</text>
  <rect x="35" y="210" width="190" height="56" rx="5" fill="#fff" stroke="#4a6fa5"/>
  <text x="130" y="232" text-anchor="middle" class="t">seqgen.py</text>
  <text x="130" y="250" text-anchor="middle" class="s">protokół: ramki A5 5A + CRC16</text>
  <rect x="35" y="276" width="190" height="44" rx="5" fill="#fff" stroke="#4a6fa5" stroke-dasharray="4 3"/>
  <text x="130" y="296" text-anchor="middle" class="t">emulator.py</text>
  <text x="130" y="312" text-anchor="middle" class="s">praca bez płytki (port „EMU”)</text>
  <text x="130" y="352" text-anchor="middle" class="s">projekt JSON, import/eksport</text>
  <text x="130" y="367" text-anchor="middle" class="s">sekwencji (.txt / .csv)</text>

  <!-- USB-UART -->
  <rect x="268" y="275" width="132" height="70" rx="6" fill="#f3f3f3" stroke="#777"/>
  <text x="334" y="302" text-anchor="middle" class="t">Konwerter</text>
  <text x="334" y="319" text-anchor="middle" class="t">USB-UART 3,3 V</text>
  <text x="334" y="336" text-anchor="middle" class="s">FT232 / CP2102</text>
  <line x1="240" y1="310" x2="266" y2="310" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="253" y="302" text-anchor="middle" class="s">USB</text>

  <!-- USB-Blaster -->
  <rect x="20" y="610" width="220" height="70" rx="6" fill="#f3f3f3" stroke="#777"/>
  <text x="130" y="638" text-anchor="middle" class="t">USB-Blaster</text>
  <text x="130" y="656" text-anchor="middle" class="s">Quartus Programmer: .sof (SRAM)</text>
  <text x="130" y="671" text-anchor="middle" class="s">lub .pof (flash)</text>
  <line x1="240" y1="645" x2="428" y2="645" class="ln" marker-end="url(#a)"/>
  <text x="334" y="637" text-anchor="middle" class="s">JTAG (złącze J10)</text>

  <!-- ===================== FPGA ===================== -->
  <rect x="430" y="45" width="770" height="715" rx="10" fill="#fafafa" stroke="#444" stroke-width="2"/>
  <text x="815" y="68" text-anchor="middle" class="h">FPGA MAX 10 10M08SAE144C8G  (MAX 10 10M08 Evaluation Kit)  –  zegar 50 MHz</text>

  <!-- Nios -->
  <rect x="455" y="90" width="210" height="80" rx="6" fill="#fff1e0" stroke="#c77700" stroke-width="1.5"/>
  <text x="560" y="114" text-anchor="middle" class="t">Nios V/c (RISC-V)</text>
  <text x="560" y="132" text-anchor="middle" class="s">firmware fw/main.c (C, bare-metal)</text>
  <text x="560" y="148" text-anchor="middle" class="s">parser protokołu, konfiguracja,</text>
  <text x="560" y="162" text-anchor="middle" class="s">zapis sekwencji, START/STOP</text>
  <!-- RAM -->
  <rect x="455" y="195" width="210" height="55" rx="6" fill="#fff1e0" stroke="#c77700"/>
  <text x="560" y="218" text-anchor="middle" class="t">On-chip RAM 16 KB</text>
  <text x="560" y="236" text-anchor="middle" class="s">kod + dane firmware (M9K)</text>
  <!-- UART -->
  <rect x="455" y="275" width="210" height="70" rx="6" fill="#fff1e0" stroke="#c77700"/>
  <text x="560" y="299" text-anchor="middle" class="t">UART RS-232</text>
  <text x="560" y="317" text-anchor="middle" class="s">115200 8N1</text>
  <text x="560" y="333" text-anchor="middle" class="s">RX = D0 (pin 74), TX = D1 (pin 75)</text>
  <line x1="400" y1="310" x2="453" y2="310" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="415" y="302" text-anchor="middle" class="s">TX/RX</text>

  <!-- clock / reset / leds -->
  <rect x="455" y="560" width="210" height="60" rx="6" fill="#eeeeee" stroke="#777"/>
  <text x="560" y="584" text-anchor="middle" class="t">Oscylator 50 MHz (pin 27)</text>
  <text x="560" y="602" text-anchor="middle" class="s">+ power-on reset → cały system</text>
  <rect x="455" y="640" width="210" height="60" rx="6" fill="#eeeeee" stroke="#777"/>
  <text x="560" y="664" text-anchor="middle" class="t">LED D1–D5</text>
  <text x="560" y="682" text-anchor="middle" class="s">heartbeat, RUN, kanały 0–2</text>

  <!-- Avalon bus -->
  <rect x="690" y="90" width="36" height="430" rx="4" fill="#dfe6ee" stroke="#5a6b7d"/>
  <text x="708" y="305" text-anchor="middle" class="t" transform="rotate(-90 708 305)">magistrala Avalon-MM</text>
  <line x1="665" y1="130" x2="688" y2="130" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="665" y1="222" x2="688" y2="222" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="665" y1="310" x2="688" y2="310" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- ===================== seq_gen16 ===================== -->
  <rect x="750" y="85" width="430" height="655" rx="8" fill="#e9f7ec" stroke="#2f8a49" stroke-width="1.8"/>
  <text x="965" y="106" text-anchor="middle" class="h">seq_gen16.vhd  –  generator 16 kanałów</text>

  <rect x="770" y="118" width="390" height="50" rx="5" fill="#fff" stroke="#2f8a49"/>
  <text x="965" y="139" text-anchor="middle" class="t">Rejestry sterujące (slave Avalon)</text>
  <text x="965" y="156" text-anchor="middle" class="s">START / STOP (maska kanałów, jeden takt), konfiguracja, status, pamięć kroków</text>
  <line x1="726" y1="143" x2="768" y2="143" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>

  <rect x="770" y="185" width="185" height="52" rx="5" fill="#fff" stroke="#2f8a49"/>
  <text x="862" y="207" text-anchor="middle" class="t">Podstawa czasu 1 µs</text>
  <text x="862" y="224" text-anchor="middle" class="s">restartowana przy START</text>

  <rect x="975" y="185" width="185" height="52" rx="5" fill="#fff" stroke="#2f8a49"/>
  <text x="1067" y="207" text-anchor="middle" class="t">Generator BASE_CLK / SYNC</text>
  <text x="1067" y="224" text-anchor="middle" class="s">okres / szerokość z PC</text>

  <!-- channel template -->
  <g id="ch0">
    <rect x="770" y="262" width="390" height="88" rx="6" fill="#f6fcf7" stroke="#2f8a49"/>
    <text x="780" y="279" class="t">seq_channel  –  kanał 0</text>
    <rect x="780" y="288" width="115" height="52" rx="4" fill="#fff" stroke="#888"/>
    <text x="837" y="309" text-anchor="middle" class="t">RAM M9K</text>
    <text x="837" y="326" text-anchor="middle" class="s">1024 kroki × 1 bit</text>
    <rect x="907" y="288" width="140" height="52" rx="4" fill="#fff" stroke="#888"/>
    <text x="977" y="306" text-anchor="middle" class="t">Sekwencer</text>
    <text x="977" y="321" text-anchor="middle" class="s">krok N µs, długość,</text>
    <text x="977" y="334" text-anchor="middle" class="s">powtórzenia, idle</text>
    <rect x="1059" y="288" width="91" height="52" rx="4" fill="#fff" stroke="#888"/>
    <text x="1104" y="309" text-anchor="middle" class="t">Rejestr</text>
    <text x="1104" y="326" text-anchor="middle" class="s">wyjścia (I/O)</text>
    <line x1="895" y1="314" x2="905" y2="314" class="ln" marker-end="url(#a)"/>
    <line x1="1047" y1="314" x2="1057" y2="314" class="ln" marker-end="url(#a)"/>
  </g>
  <use href="#ch0" y="100"/>
  <rect x="770" y="362" width="160" height="16" fill="#f6fcf7"/>
  <text x="780" y="379" class="t">seq_channel  –  kanał 1</text>
  <text x="965" y="478" text-anchor="middle" font-size="22" fill="#2f8a49">⋮</text>
  <text x="965" y="497" text-anchor="middle" class="s">kanały 2 … 14 (identyczne bloki)</text>
  <use href="#ch0" y="250"/>
  <rect x="770" y="512" width="160" height="16" fill="#f6fcf7"/>
  <text x="780" y="529" class="t">seq_channel  –  kanał 15</text>

  <!-- internal arrows -->
  <line x1="862" y1="237" x2="862" y2="260" class="ln" marker-end="url(#a)"/>
  <text x="870" y="253" class="s">tick 1 µs (do wszystkich kanałów)</text>
  <line x1="760" y1="168" x2="760" y2="565" stroke="#2f8a49" stroke-width="2"/>
  <line x1="760" y1="314" x2="778" y2="314" class="ln" marker-end="url(#a)"/>
  <line x1="760" y1="414" x2="778" y2="414" class="ln" marker-end="url(#a)"/>
  <line x1="760" y1="564" x2="778" y2="564" class="ln" marker-end="url(#a)"/>

  <text x="965" y="632" text-anchor="middle" class="s">1 blok VHDL = 1 kanał.</text>
  <text x="965" y="650" text-anchor="middle" class="s">Kanały startowane jedną maską ruszają w tym samym takcie 50 MHz.</text>
  <text x="965" y="668" text-anchor="middle" class="s">Wszystkie wyjścia (kanały, BASE_CLK, SYNC) mają identyczne</text>
  <text x="965" y="686" text-anchor="middle" class="s">opóźnienie potokowe, a ostatni rejestr każdego wyjścia leży</text>
  <text x="965" y="704" text-anchor="middle" class="s">w komórce I/O – zbocza wypadają w tym samym takcie.</text>

  <!-- ===================== connectors ===================== -->
  <rect x="1225" y="180" width="160" height="62" rx="6" fill="#f1f1f1" stroke="#777"/>
  <text x="1305" y="203" text-anchor="middle" class="t">J8 pin 7 / 9</text>
  <text x="1305" y="220" text-anchor="middle" class="s">BASE_CLK (56) / SYNC (55)</text>
  <line x1="1160" y1="211" x2="1223" y2="211" class="ln" marker-end="url(#a)"/>

  <rect x="1225" y="280" width="160" height="150" rx="6" fill="#f1f1f1" stroke="#777"/>
  <text x="1305" y="304" text-anchor="middle" class="t">Złącza Arduino</text>
  <text x="1305" y="322" text-anchor="middle" class="t">J5 / J3: D2 … D13</text>
  <text x="1305" y="342" text-anchor="middle" class="s">CH0 … CH11</text>
  <text x="1305" y="360" text-anchor="middle" class="s">piny 76 77 79 81 84 86</text>
  <text x="1305" y="376" text-anchor="middle" class="s">62 64 65 66 69 70</text>
  <text x="1305" y="398" text-anchor="middle" class="s">wyjścia 0/1, 3,3 V LVCMOS</text>
  <line x1="1160" y1="314" x2="1223" y2="314" class="ln" marker-end="url(#a)"/>
  <line x1="1160" y1="414" x2="1223" y2="414" class="ln" marker-end="url(#a)"/>

  <rect x="1225" y="520" width="160" height="90" rx="6" fill="#f1f1f1" stroke="#777"/>
  <text x="1305" y="544" text-anchor="middle" class="t">J8 pin 3 – 6</text>
  <text x="1305" y="562" text-anchor="middle" class="s">CH12 … CH15</text>
  <text x="1305" y="580" text-anchor="middle" class="s">piny 60 59 58 57</text>
  <text x="1305" y="598" text-anchor="middle" class="s">(listwa 2×20 do dolutowania)</text>
  <line x1="1160" y1="564" x2="1223" y2="564" class="ln" marker-end="url(#a)"/>

  <!-- legend -->
  <rect x="20" y="420" width="220" height="150" rx="6" fill="#ffffff" stroke="#bbb"/>
  <text x="32" y="442" class="t">Legenda</text>
  <rect x="32" y="452" width="16" height="12" fill="#e8f0fe" stroke="#4a6fa5"/><text x="56" y="462" class="s">oprogramowanie PC</text>
  <rect x="32" y="474" width="16" height="12" fill="#fff1e0" stroke="#c77700"/><text x="56" y="484" class="s">system procesorowy (Platform Designer)</text>
  <rect x="32" y="496" width="16" height="12" fill="#e9f7ec" stroke="#2f8a49"/><text x="56" y="506" class="s">logika generatora (VHDL)</text>
  <rect x="32" y="518" width="16" height="12" fill="#f1f1f1" stroke="#777"/><text x="56" y="528" class="s">sprzęt / złącza płytki</text>
  <line x1="32" y1="550" x2="62" y2="550" class="ln" marker-end="url(#a)"/><text x="70" y="554" class="s">kierunek danych / sygnału</text>
</svg>
